name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter (Latest Stable)
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Generate Zero-Permission Latest Android Scaffolding
        run: |
          rm -rf android
          flutter create --org com.personal --project-name daedong_note --platforms=android .
          
          # 모든 uses-permission 완전 제거 (인터넷, 알림, 전화, SMS 등 권한 0개)
          sed -i '/<uses-permission/d' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label=".*"/android:label="대동노트"/g' android/app/src/main/AndroidManifest.xml

          # 새로운 정식 Keystore 생성
          keytool -genkeypair -v -keystore android/app/note_release.jks -alias daedongnote -keyalg RSA -keysize 2048 -validity 10000 -storepass 135790 -keypass 135790 -dname "CN=Personal Note, OU=App, O=Note, L=Seoul, C=KR"

          # Gradle 서명 설정 (build.gradle 또는 build.gradle.kts 모두 대응)
          if [ -f "android/app/build.gradle" ]; then
            cat << 'EOF' > patch_signing.py
          with open("android/app/build.gradle", "r") as f:
              content = f.read()
          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('note_release.jks')
                      storePassword '135790'
                      keyAlias 'daedongnote'
                      keyPassword '135790'
                  }
              }
          """
          content = content.replace("android {", "android {" + signing_block, 1)
          content = content.replace("signingConfig = signingConfigs.debug", "signingConfig = signingConfigs.release")
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")
          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          EOF
            python3 patch_signing.py
          elif [ -f "android/app/build.gradle.kts" ]; then
            cat << 'EOF' > patch_signing_kts.py
          with open("android/app/build.gradle.kts", "r") as f:
              content = f.read()
          signing_block = """
              signingConfigs {
                  create("release") {
                      storeFile = file("note_release.jks")
                      storePassword = "135790"
                      keyAlias = "daedongnote"
                      keyPassword = "135790"
                  }
              }
          """
          content = content.replace("android {", "android {" + signing_block, 1)
          content = content.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("release")')
          with open("android/app/build.gradle.kts", "w") as f:
              f.write(content)
          EOF
            python3 patch_signing_kts.py
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Build Signed APK (Latest Android SDK Target)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Inspect APK Permissions & Signature
        run: |
          AAPT=$(find $ANDROID_HOME/build-tools -name "aapt" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "=== APK Permissions ==="
          $AAPT dump permissions build/app/outputs/flutter-apk/app-release.apk
          echo "=== APK Badging (SDK Versions) ==="
          $AAPT dump badging build/app/outputs/flutter-apk/app-release.apk | head -n 5
          echo "=== APK Signature ==="
          $APKSIGNER verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedong_note_zero_perm_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
