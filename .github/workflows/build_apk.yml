name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Scaffolding & Configure v2/v3 Signing
        run: |
          # 1. 안드로이드 프로젝트 스캐폴딩
          flutter create --org com.daedong --project-name daedong_rent_app --platforms=android .
          echo "flutter.minSdkVersion=23" >> android/local.properties
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk.*/minSdkVersion = 23/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion = 23/g' {} +
          
          # 2. 정식 Keystore 키 파일 생성
          keytool -genkeypair -v -keystore android/app/release.jks -alias daedong -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Daedong Housing, OU=Rent, O=Daedong, L=Seoul, C=KR"

          # 3. Gradle에 정식 릴리즈 서명(v1 + v2 + v3 Scheme) 설정 주입
          cat << 'EOF' > patch_signing.py
          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('release.jks')
                      storePassword '123456'
                      keyAlias 'daedong'
                      keyPassword '123456'
                  }
              }
          """
          content = content.replace("android {", "android {" + signing_block, 1)
          content = content.replace("signingConfig = signingConfigs.debug", "signingConfig = signingConfigs.release")
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          EOF
          python3 patch_signing.py

          # 알림 권한 추가
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build Signed APK (Release with v1, v2, v3 Signature)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedong_rent_apk_v2signed
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
