name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Android Scaffolding & Configure Safe App
        run: |
          flutter create --org com.daedong --project-name daedong_rent_app --platforms=android .
          echo "flutter.minSdkVersion=23" >> android/local.properties
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk.*/minSdkVersion = 23/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion = 23/g' {} +
          # 안전한 기본 권한(알림 전송만 유지, 위험 권한인 RECEIVE_SMS, READ_SMS 전면 배제)
          sed -i '/<application/i \    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />' android/app/src/main/AndroidManifest.xml

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Create Keystore & Sign APK
        run: |
          # 신뢰할 수 있는 개발자 서명 생성
          keytool -genkeypair -v -keystore release.jks -alias daedong -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=Daedong Housing, OU=Rent, O=Daedong, L=Seoul, C=KR"
          # APK 정식 서명 적용
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore release.jks -storepass 123456 -keypass 123456 build/app/outputs/flutter-apk/app-release.apk daedong

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedong_rent_apk_safe
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
