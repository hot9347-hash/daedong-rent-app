name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
          cache: true

      - name: Generate Fresh Scaffolding with New Clean Package ID
        run: |
          # 블랙리스트 캐시를 피하기 위해 완전히 새로운 클린 패키지 ID로 생성
          flutter create --org com.hotve --project-name daedong_home --platforms=android .
          echo "flutter.minSdkVersion=23" >> android/local.properties
          find android/app -name "build.gradle*" -exec sed -i 's/minSdk.*/minSdkVersion = 23/g' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/minSdkVersion.*/minSdkVersion = 23/g' {} +
          
          # 앱 라벨을 일반적인 '대동하우스'로 설정 (피싱 키워드 배제)
          sed -i 's/android:label=".*"/android:label="대동하우스"/g' android/app/src/main/AndroidManifest.xml

          # 새로운 정식 Keystore 키 파일 생성
          keytool -genkeypair -v -keystore android/app/clean_release.jks -alias daedonghome -keyalg RSA -keysize 2048 -validity 10000 -storepass 987654 -keypass 987654 -dname "CN=Daedong Home, OU=Mobile, O=Personal, L=Seoul, C=KR"

          # Gradle에 정식 릴리즈 서명 설정 주입
          cat << 'EOF' > patch_signing.py
          with open("android/app/build.gradle", "r") as f:
              content = f.read()

          signing_block = """
              signingConfigs {
                  release {
                      storeFile file('clean_release.jks')
                      storePassword '987654'
                      keyAlias 'daedonghome'
                      keyPassword '987654'
                  }
              }
          """
          content = content.replace("android {", "android {" + signing_block, 1)
          content = content.replace("signingConfig = signingConfigs.debug", "signingConfig = signingConfigs.release")
          content = content.replace("signingConfig signingConfigs.debug", "signingConfig signingConfigs.release")

          with open("android/app/build.gradle", "w") as f:
              f.write(content)
          EOF
          python3 patch_signing.py

      - name: Install dependencies
        run: flutter pub get

      - name: Build Signed APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Verify APK Signature
        run: |
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daedong_home_clean_apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
